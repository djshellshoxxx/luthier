# Release: a version tag (v1.2.3, v1.3.0-beta1) builds, tests and validates on
# every platform at full strictness with LTO, builds the installers, and
# uploads them with SHA-256 checksums to a DRAFT GitHub Release. A person
# reviews the draft and publishes it; nothing here publishes on its own.
#
# See docs/RELEASING.md for the whole procedure and the signing secrets.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build a draft release for, e.g. v1.0.0 or v1.0.0-beta1'
        required: true
        type: string
      ref:
        description: 'Branch or commit to build when the tag does not exist yet; the draft release then creates the tag there'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platforms to build: linux, windows, macos (default all)'
        required: false
        type: string
        default: 'linux,windows,macos'
      editions:
        description: 'Comma-separated editions to build: pro, free (default both)'
        required: false
        type: string
        default: 'pro,free'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - id: v
        name: Tag matches CMakeLists.txt
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || {
            echo "::error::Invalid version tag"; exit 1;
          }
          version="${tag#v}"
          # The requested public beta tag abbreviates the numeric patch.
          [ "$tag" != "v0.1-beta" ] || version="0.1.0-beta"
          # project(Luthier VERSION x.y.z ...) is the one source of the version.
          cmake_version="$(sed -nE 's/^project\(Luthier VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | tr -d '\r')"
          # A pre-release suffix (-beta1, -rc2) is allowed on top of the CMake version.
          if [ "${version%%-*}" != "$cmake_version" ]; then
            echo "::error::Tag $tag does not match project VERSION $cmake_version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # An existing tag must already identify exactly this checked-out source.
          source_sha="$(git rev-parse HEAD)"
          refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$refs" ]; then
            tagged_sha="$(printf '%s\n' "$refs" | awk '{ if ($2 ~ /\^\{\}$/) peeled=$1; else plain=$1 } END { print peeled ? peeled : plain }')"
            test "$tagged_sha" = "$source_sha" || {
              echo "::error::Existing tag points to different source; choose a new version."
              exit 1
            }
          fi
          # Freeze checkout once; all platform jobs and the final tag use this commit.
          echo "ref=$source_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build and package
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      platforms: ${{ inputs.platforms || 'linux,windows,macos' }}
      editions: ${{ inputs.editions || 'pro,free' }}
      strictness: 10
      lto: true
      package: true
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
    secrets: inherit

  draft:
    name: Draft GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The by-tag endpoint omits drafts. Inspect every visible release page.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if printf '%s\n' "$tags" | grep -Fxq -- "$TAG"; then
            echo "::error::Release or draft already exists; choose a new version."
            exit 1
          fi

      - name: Verify or create the frozen source tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [ -z "$refs" ]; then
            # Create-only API: a concurrent tag creation fails; never update a ref.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" > /dev/null
            refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          fi
          tagged_sha="$(printf '%s\n' "$refs" | awk '{ if ($2 ~ /\^\{\}$/) peeled=$1; else plain=$1 } END { print peeled ? peeled : plain }')"
          test "$tagged_sha" = "$SOURCE_SHA" || {
            echo "::error::Tag does not identify the tested source; refusing release."
            exit 1
          }

      - name: Record source and qualification provenance
        env:
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}
          EDITIONS: ${{ inputs.editions || 'pro,free' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          info = {
              "source_commit": os.environ["SOURCE_SHA"],
              "version": os.environ["RELEASE_VERSION"],
              "platforms": os.environ["PLATFORMS"].split(","),
              "editions": os.environ["EDITIONS"].split(","),
              "ci_run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "validation": "All selected build, unit-test, plugin-validator and packaging jobs succeeded; strictness10 and LTO enabled.",
              "manual_acceptance": "Hardware, DAW, installation and listening acceptance are separate; see release notes.",
              "signing": "Signing and notarization depend on configured identities; see per-platform logs. No signing claim is inferred from compilation.",
          }
          Path("release/BUILD-PROVENANCE.json").write_text(json.dumps(info, indent=2) + "\n")
          PYPROVENANCE

      - name: Checksums (installer.md 10)
        working-directory: release
        run: |
          ls -la
          sha256sum -- * | grep -v 'SHA256SUMS' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the checksum manifest
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: release
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY not set: SHA256SUMS.txt is unsigned"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Unlike update-or-create actions, this command never edits a release.
          args=(release create "$TAG" --verify-tag --target "$SOURCE_SHA" --draft
                --title "Luthier $VERSION" --generate-notes)
          [[ "$VERSION" != *-* ]] || args+=(--prerelease)
          gh "${args[@]}" release/*
