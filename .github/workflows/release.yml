# Release: a version tag (v1.2.3, v1.3.0-beta1), or a release/v* candidate
# branch, builds, tests and validates on
# every platform at full strictness with LTO, builds the installers, and
# uploads them with SHA-256 checksums to a DRAFT GitHub Release. Two runs
# additionally verify and publish their own prerelease: the authorized
# release/v0.1.0-beta2 push, and the authorized beta3 dispatch (a dispatch of
# this workflow on claude/determined-ptolemy-mlbclp with tag v0.1.0-beta3 and
# ref claude/determined-ptolemy-mlbclp). Every other tag, candidate (including
# release/v0.1.0-beta3) and manual dispatch retains draft review.
#
# See docs/RELEASING.md for the whole procedure and the signing secrets.
name: release

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag to build a draft release for, e.g. v1.0.0 or v1.0.0-beta1'
        required: true
        type: string
      ref:
        description: 'Branch or commit to build when the tag does not exist yet; the draft release then creates the tag there'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platforms to build: linux, windows, macos (default linux,windows,macos)'
        required: false
        type: string
        default: 'linux,windows,macos'
      editions:
        description: 'Comma-separated editions to build: pro, free (default both)'
        required: false
        type: string
        default: 'pro,free'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # Candidate updates supersede their prior run; immutable tag/dispatch builds
  # retain their existing serialization and create-only release behavior.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.sha }}
      - name: PyYAML for the structural workflow guards
        # The guard tests parse release.yml; install the distro package only if the
        # runner image lacks it (a missing module would fail the guards, safely).
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-yaml; }

      - name: Exercise release source and publication guards
        run: |
          python3 -m unittest discover -s scripts/tests -p test_release_workflow_guards.py -v
          python3 -m unittest discover -s scripts/tests -p test_publish_qualified_beta.py -v
          python3 -m unittest discover -s scripts/tests -p test_consolidate_qualified_beta.py -v
          python3 -m unittest discover -s scripts -p test_release_packaging_compat.py -v
          bash scripts/test_uninstall_macos.sh

      - id: v
        name: Tag matches CMakeLists.txt
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          # Creating a dedicated candidate branch starts the same qualification
          # pipeline as a manual dispatch. Its name carries the intended tag;
          # the tag itself is created only after every build/package job passes.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            tag="${tag#release/}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || {
            echo "::error::Invalid version tag"; exit 1;
          }
          version="${tag#v}"
          # The requested public beta tag abbreviates the numeric patch.
          [ "$tag" != "v0.1-beta" ] || version="0.1.0-beta"
          # project(Luthier VERSION x.y.z ...) is the one source of the version.
          cmake_version="$(sed -nE 's/^project\(Luthier VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | tr -d '\r')"
          # A pre-release suffix (-beta1, -rc2) is allowed on top of the CMake version.
          if [ "${version%%-*}" != "$cmake_version" ]; then
            echo "::error::Tag $tag does not match project VERSION $cmake_version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # An existing tag must already identify exactly this checked-out source.
          source_sha="$(git rev-parse HEAD)"
          refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$refs" ]; then
            tagged_sha="$(printf '%s\n' "$refs" | awk '{ if ($2 ~ /\^\{\}$/) peeled=$1; else plain=$1 } END { print peeled ? peeled : plain }')"
            test "$tagged_sha" = "$source_sha" || {
              echo "::error::Existing tag points to different source; choose a new version."
              exit 1
            }
          fi
          # Freeze checkout once; all platform jobs and the final tag use this commit.
          echo "ref=$source_sha" >> "$GITHUB_OUTPUT"

      # The checkout resolves inputs.ref when this job starts, so the branch can
      # have moved since the dispatch. The authorized beta3 dispatch qualifies and
      # publishes only the dispatched commit itself.
      - name: Require the authorized beta3 dispatch to build its dispatched commit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/determined-ptolemy-mlbclp' && inputs.tag == 'v0.1.0-beta3' && inputs.ref == 'claude/determined-ptolemy-mlbclp'
        env:
          SOURCE_SHA: ${{ steps.v.outputs.ref }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$GITHUB_SHA" ] || [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $head_sha (frozen ${SOURCE_SHA:-none}), not the dispatched commit $GITHUB_SHA; refusing the beta3 dispatch."
            exit 1
          fi

      - name: Refuse an existing release before building
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$TAG" <<< "$tags"; then
            echo "::error::Release or draft already exists; choose a new version."
            exit 1
          fi

  installer-checks:
    name: Windows edition coexistence
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install, reinstall and remove both editions using real Inno Setup
        shell: pwsh
        run: scripts/test_install_windows.ps1
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-coexistence-logs
          path: ${{ runner.temp }}/luthier-install-check-*/*.log
          if-no-files-found: ignore

  build:
    name: Build and package
    needs: [version, installer-checks]
    uses: ./.github/workflows/build.yml
    with:
      # Beta3 ships Linux, Windows and macOS (VST3, CLAP, standalone; AU on
      # macOS): every platform builds, validates (pluginval, clap-validator)
      # and packages the CLAP plug-in. The release/v0.1.0-beta2 candidate push
      # (a push has no inputs) keeps beta2's qualified scope, Windows and macOS
      # without CLAP, which its publisher allowlist entry requires.
      platforms: ${{ inputs.platforms || (github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-beta2' && 'windows,macos' || 'linux,windows,macos') }}
      editions: ${{ inputs.editions || 'pro,free' }}
      no_clap: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-beta2' }}
      # Four interleaved shards keep each macOS job inside the 6-hour limit.
      test_shards: 4
      strictness: 10
      lto: true
      package: true
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
    secrets: inherit

  draft:
    name: Draft GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The by-tag endpoint omits drafts. Inspect every visible release page.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$TAG" <<< "$tags"; then
            echo "::error::Release or draft already exists; choose a new version."
            exit 1
          fi

      - name: Verify or create the frozen source tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')"
            test "$candidate_sha" = "$SOURCE_SHA" || {
              echo "::error::Candidate branch advanced during qualification; refusing stale release."
              exit 1
            }
          fi
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [ -z "$refs" ]; then
            # Create-only API: a concurrent tag creation fails; never update a ref.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" > /dev/null
            refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          fi
          tagged_sha="$(printf '%s\n' "$refs" | awk '{ if ($2 ~ /\^\{\}$/) peeled=$1; else plain=$1 } END { print peeled ? peeled : plain }')"
          test "$tagged_sha" = "$SOURCE_SHA" || {
            echo "::error::Tag does not identify the tested source; refusing release."
            exit 1
          }

      - name: Record source and qualification provenance
        env:
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PLATFORMS: ${{ inputs.platforms || (github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-beta2' && 'windows,macos' || 'linux,windows,macos') }}
          EDITIONS: ${{ inputs.editions || 'pro,free' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PYPROVENANCE'
          import json, os
          from pathlib import Path
          info = {
              "source_commit": os.environ["SOURCE_SHA"],
              "version": os.environ["RELEASE_VERSION"],
              "platforms": os.environ["PLATFORMS"].split(","),
              "editions": os.environ["EDITIONS"].split(","),
              "ci_run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "validation": "All selected build, unit-test, plugin-validator and packaging jobs succeeded; strictness10 and LTO enabled.",
              "manual_acceptance": "Hardware, DAW, installation and listening acceptance are separate; see release notes.",
              "signing": "Signing and notarization depend on configured identities; see per-platform logs. No signing claim is inferred from compilation.",
          }
          Path("release/BUILD-PROVENANCE.json").write_text(json.dumps(info, indent=2) + "\n")
          PYPROVENANCE

      - name: Checksums (installer.md 10)
        working-directory: release
        run: |
          ls -la
          sha256sum -- * | grep -v 'SHA256SUMS' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the checksum manifest
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: release
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY not set: SHA256SUMS.txt is unsigned"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Unlike update-or-create actions, this command never edits a release.
          args=(release create "$TAG" --verify-tag --target "$SOURCE_SHA" --draft
                --title "Luthier $VERSION")
          if [ "$VERSION" = "0.1.0-beta3" ]; then
            args+=(--notes-file docs/beta/PRO-V01-BETA3-RELEASE-NOTES.md)
          elif [ "$VERSION" = "0.1.0-beta2" ]; then
            args+=(--notes-file docs/beta/PRO-V01-BETA2-RELEASE-NOTES.md)
          else
            args+=(--generate-notes)
          fi
          [[ "$VERSION" != *-* ]] || args+=(--prerelease)
          gh "${args[@]}" release/*

      - name: Publish the authorized qualified beta2
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-beta2' && needs.version.outputs.tag == 'v0.1.0-beta2'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          QUALIFICATION_RESULT: ${{ needs.build.result }}
        run: |
          python3 scripts/publish_qualified_beta.py --directory release --source "$SOURCE_SHA" --tag "$TAG"

      - name: Publish the authorized qualified beta3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/determined-ptolemy-mlbclp' && inputs.tag == 'v0.1.0-beta3' && inputs.ref == 'claude/determined-ptolemy-mlbclp' && needs.version.outputs.tag == 'v0.1.0-beta3'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          QUALIFICATION_RESULT: ${{ needs.build.result }}
        run: |
          python3 scripts/publish_qualified_beta.py --directory release --source "$SOURCE_SHA" --tag "$TAG"

  consolidate:
    name: Consolidate the published beta2 source
    needs: [version, draft]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-beta2' && needs.version.outputs.tag == 'v0.1.0-beta2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - name: Fast-forward unchanged master to the verified release source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          PUBLICATION_RESULT: ${{ needs.draft.result }}
        run: |
          python3 scripts/consolidate_qualified_beta.py --source "$SOURCE_SHA"
