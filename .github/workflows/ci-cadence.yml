# Build cadence (2026-09-29): the repository is public, so GitHub-hosted
# Linux, Windows and macOS runners are free. Every push to an integration or
# edition branch, and every pull request, builds and tests all three
# platforms in parallel. (The earlier every-3rd / every-15th gate existed only
# to save paid minutes and has been removed.)
# Any platform can still be run by hand: Actions -> build -> Run workflow.
name: ci

on:
  push:
    branches:
      - master
      - main
      - claude/luthier-cloud-session-5lzlix   # previous integration branch
      - claude/ecstatic-hawking-prpppy        # integration (2026-09-29)
      - claude/luthier-free
      - claude/luthier-pro
    tags-ignore: ['v*']   # release.yml handles version tags
    paths-ignore:
      - 'spec/**'
      - 'docs/**'
      - '**/*.md'
      - 'troubleshooting/**'
      - '*.png'
  pull_request:
    paths-ignore:
      - 'spec/**'
      - 'docs/**'
      - '**/*.md'
      - 'troubleshooting/**'
      - '*.png'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build.yml
    with:
      platforms: linux
    secrets: inherit

  windows:
    name: Windows
    uses: ./.github/workflows/build.yml
    with:
      platforms: windows
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/build.yml
    with:
      platforms: macos
    secrets: inherit
