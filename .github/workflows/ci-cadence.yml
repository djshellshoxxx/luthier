# The product owner's build cadence (2026-09-26), to keep GitHub Actions
# minutes in check:
#   - Linux builds and tests on every push to the integration and edition
#     branches.
#   - Windows also builds on every 3rd successful Linux build.
#   - macOS also builds on every 15th successful Linux build (macOS minutes
#     cost 10x Linux ones).
# Any platform can still be run by hand: Actions -> build -> Run workflow.
#
# Counting: every Linux build that passes uploads a tiny marker artefact named
# ci-linux-success. The gate counts those markers (one API call), so a failed
# Linux build never advances the count. Markers are kept 90 days.
name: ci

on:
  push:
    branches:
      - master
      - main
      - claude/luthier-cloud-session-5lzlix   # integration
      - claude/luthier-free
      - claude/luthier-pro
      - codex/luthier-beta
      - codex/luthier-beta-looper-concurrency
    tags-ignore: ['v*']   # release.yml handles version tags
    paths-ignore:
      - 'spec/**'
      - 'docs/**'
      - '**/*.md'
      - 'troubleshooting/**'
      - '*.png'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build.yml
    with:
      platforms: linux
    secrets: inherit

  gate:
    name: Cadence
    needs: linux
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.count.outputs.windows }}
      macos: ${{ steps.count.outputs.macos }}
      number: ${{ steps.count.outputs.number }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ci-linux-success&per_page=1" --jq '.total_count')
          n=$((before + 1))
          # PAUSED 2026-09-26 (owner request): Windows and macOS builds are held
          # until the project is fully complete. The cadence logic below is kept
          # but forced off. To resume: restore the modulo lines and delete the
          # two "false  # PAUSED" overrides.
          windows=false; macos=false
          # [ $((n % 3)) -eq 0 ] && windows=true    # PAUSED
          # [ $((n % 15)) -eq 0 ] && macos=true     # PAUSED
          [ $((n % 3)) -eq 0 ] && windows=true   # beta: Windows re-enabled (PR #9)
          macos=true      # public repo: macOS runners are free, build every push/PR
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          {
            echo "### Successful Linux build #$n"
            echo "- Windows this time: $windows (every 3rd Linux build)"
            echo "- macOS this time: $macos (public repo: enabled)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$n" > marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-linux-success
          path: marker.txt
          retention-days: 90

  windows:
    name: Windows
    needs: gate
    if: needs.gate.outputs.windows == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platforms: windows
    secrets: inherit

  macos:
    name: macOS
    needs: gate
    if: needs.gate.outputs.macos == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platforms: macos
    secrets: inherit
