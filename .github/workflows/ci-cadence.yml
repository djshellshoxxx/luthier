# Build cadence for pushes (docs/infra/CI.md):
#   - Linux builds and tests on every push to the default, integration and
#     edition branches.
#   - A push to the default branch (master or main: a merged pull request)
#     also builds and tests Windows and macOS, after Linux passes. Pull
#     requests run Linux only (pr-verification.yml), so this is where native
#     regressions are caught automatically.
#   - Other branches: Windows on every 3rd and macOS on every 15th successful
#     Linux build (the cadence of 2026-09-26).
# Any platform can still be run by hand: Actions -> build -> Run workflow.
#
# Counting: every Linux build that passes uploads a tiny marker artefact named
# ci-linux-success. The gate counts those markers (one API call), so a failed
# Linux build never advances the count. Markers are kept 90 days.
name: ci

on:
  push:
    branches:
      - master
      - main
      - claude/luthier-cloud-session-5lzlix   # integration
      - claude/luthier-free
      - claude/luthier-pro
      - codex/luthier-beta
      - codex/luthier-beta-looper-concurrency
      - claude/luthier-consolidate        # consolidation of every open branch
    tags-ignore: ['v*']   # release.yml handles version tags
    # Skip runs for documentation and images only. A positive list with
    # exclusions (not paths-ignore) so the few documentation files that are
    # test inputs still trigger: docs/TROUBLESHOOTING.md is checked by
    # scripts/check_packaging_paths.cmake in the test step, and
    # Source/Tests/Fixtures holds markdown test corpora.
    paths:
      - '**'
      - '.github/**'
      - '!docs/**'
      - '!spec/**'
      - '!troubleshooting/**'
      - '!**/*.md'
      - '!*.png'
      - '!*.jpg'
      - '!LICENSE'
      - 'docs/TROUBLESHOOTING.md'
      - 'Source/Tests/Fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build.yml
    with:
      platforms: linux
    secrets: inherit

  gate:
    name: Cadence
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read   # count the ci-linux-success markers
    outputs:
      windows: ${{ steps.count.outputs.windows }}
      macos: ${{ steps.count.outputs.macos }}
      number: ${{ steps.count.outputs.number }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ci-linux-success&per_page=1" --jq '.total_count')
          n=$((before + 1))
          windows=false; macos=false
          case "$GITHUB_REF" in
            refs/heads/master|refs/heads/main)
              # The default branch: every push (a merge) gets every platform.
              windows=true; macos=true; why="default branch: every push" ;;
            *)
              [ $((n % 3)) -eq 0 ] && windows=true
              [ $((n % 15)) -eq 0 ] && macos=true
              why="Windows every 3rd, macOS every 15th successful Linux build" ;;
          esac
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          {
            echo "### Successful Linux build #$n"
            echo "- Windows this time: $windows"
            echo "- macOS this time: $macos"
            echo "- Rule: $why"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$n" > marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-linux-success
          path: marker.txt
          retention-days: 90

  windows:
    name: Windows
    needs: gate
    if: needs.gate.outputs.windows == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platforms: windows
    secrets: inherit

  macos:
    name: macOS
    needs: gate
    if: needs.gate.outputs.macos == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platforms: macos
    secrets: inherit
