name: Unqualified native diagnostics

on:
  push:
    branches: [codex/luthier-native-diagnostics, codex/luthier-macos-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build-ci
  DIST_DIR: dist
  CONFIG: Release
  LUTHIER_EDITION: PAID
  LUTHIER_LTO: 'OFF'
  LUTHIER_BUILD_STRING: ${{ github.sha }}
  PLUGINVAL_STRICTNESS: '5'
  MACOS_ARCHS: 'arm64;x86_64'
  JOBS: '4'

jobs:
  windows:
    name: Windows x64 Pro — UNQUALIFIED DIAGNOSTIC
    if: github.ref == 'refs/heads/codex/luthier-native-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # First-party replacement for the MSVC and Ninja setup actions (same
      # steps as build.yml); compiler output is not cached.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools on this runner.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $vars = & cmd.exe /d /c "`"$vcvars`" x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat x64 failed ($LASTEXITCODE)." }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version
          Get-Command cl.exe | Select-Object -ExpandProperty Source
      - name: Dependency pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          juce=$(sed -n 's/^JUCE_TAG="\(.*\)"$/\1/p' scripts/ci_build.sh)
          clap=$(sed -n 's/^CLAP_JUCE_EXT_COMMIT="\(.*\)"$/\1/p' scripts/ci_build.sh)
          [ -n "$juce" ] && [ "${#clap}" -eq 40 ] || { echo "::error::cannot read the dependency pins from scripts/ci_build.sh"; exit 1; }
          echo "key=juce-$juce-clap-$clap" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ThirdParty/JUCE
            ThirdParty/clap-juce-extensions
          key: thirdparty-${{ runner.os }}-${{ steps.pins.outputs.key }}-${{ hashFiles('scripts/patch_juce_midi_capacity.py', 'scripts/patch_clap_host_intent.py') }}
      - name: Fetch pinned dependencies
        shell: pwsh
        run: scripts/ci_build.ps1 -Step deps
      - name: Build existing supported targets
        id: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-ci/logs | Out-Null
          & scripts/ci_build.ps1 -Step configure,build -Lto OFF -Edition PAID -Jobs 4 *>&1 | Tee-Object -FilePath build-ci/logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run unchanged focused tests (GUI included)
        id: focus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        run: python scripts/native_diagnostics.py focus
      - name: Required VST3 and CLAP validators, strictness 5
        id: validate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          foreach ($format in @('VST3/Luthier Pro.vst3', 'CLAP/Luthier Pro.clap')) {
            if (!(Test-Path (Join-Path 'build-ci/Luthier_artefacts/Release' $format))) { throw "Required format missing: $format" }
          }
          scripts/ci_build.ps1 -Step validate -Strictness 5 -Edition PAID
      - name: Stage successful build despite diagnostic failures
        id: stage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: scripts/ci_build.ps1 -Step stage -Edition PAID
      - name: Bundle unqualified binaries, evidence, source and licensing
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          DIAGNOSTIC_BUILD: ${{ steps.build.outcome }}
          DIAGNOSTIC_FOCUS: ${{ steps.focus.outcome }}
          DIAGNOSTIC_VALIDATE: ${{ steps.validate.outcome }}
          DIAGNOSTIC_ARCHITECTURE: x64 toolchain; native execution only
          DIAGNOSTIC_STAGE: ${{ steps.stage.outcome }}
        run: python scripts/native_diagnostics.py bundle
      - name: Upload diagnostics (never a release)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: UNQUALIFIED-DIAGNOSTIC-windows-pro-${{ github.sha }}
          path: |
            diagnostic-artifacts/
            build-ci/logs/
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS universal Pro — UNQUALIFIED DIAGNOSTIC
    if: github.ref == 'refs/heads/codex/luthier-native-diagnostics' || github.ref == 'refs/heads/codex/luthier-macos-diagnostics'
    runs-on: macos-latest
    timeout-minutes: 105
    env:
      JOBS: '3'   # 3 vCPU / 7 GB arm64 runner, universal build (docs/infra/CI.md)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ninja
        run: |
          command -v ninja >/dev/null || brew install ninja
          ninja --version
      - name: Dependency pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          juce=$(sed -n 's/^JUCE_TAG="\(.*\)"$/\1/p' scripts/ci_build.sh)
          clap=$(sed -n 's/^CLAP_JUCE_EXT_COMMIT="\(.*\)"$/\1/p' scripts/ci_build.sh)
          [ -n "$juce" ] && [ "${#clap}" -eq 40 ] || { echo "::error::cannot read the dependency pins from scripts/ci_build.sh"; exit 1; }
          echo "key=juce-$juce-clap-$clap" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ThirdParty/JUCE
            ThirdParty/clap-juce-extensions
          key: thirdparty-${{ runner.os }}-${{ steps.pins.outputs.key }}-${{ hashFiles('scripts/patch_juce_midi_capacity.py', 'scripts/patch_clap_host_intent.py') }}
      - name: Fetch pinned dependencies
        shell: bash
        run: scripts/ci_build.sh deps
      - name: Build existing supported targets
        id: build
        shell: bash
        run: scripts/ci_build.sh configure build-diagnostic
      - name: Verify universal binaries and record actual runtime architecture
        id: architecture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/native_diagnostics.py architecture
      - name: Mark current macOS job before focused execution
        id: marker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/native_diagnostics.py mark_focus
      - name: Run unchanged focused tests (GUI included)
        id: focus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        run: python scripts/native_diagnostics.py focus
      - name: Collect sanitized current-job macOS focus failure evidence
        id: collection
        if: ${{ !cancelled() && steps.focus.outcome == 'failure' }}
        run: python scripts/native_diagnostics.py collect_failure
      - name: Required VST3 and CLAP validators, strictness 5
        id: validate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        run: scripts/ci_build.sh validate-diagnostic
      - name: Stage successful build despite diagnostic failures
        id: stage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: scripts/ci_build.sh stage
      - name: Bundle unqualified binaries, evidence, source and licensing
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          DIAGNOSTIC_MARKER: ${{ steps.marker.outcome }}
          DIAGNOSTIC_COLLECTION: ${{ steps.collection.outcome }}
          DIAGNOSTIC_BUILD: ${{ steps.build.outcome }}
          DIAGNOSTIC_FOCUS: ${{ steps.focus.outcome }}
          DIAGNOSTIC_VALIDATE: ${{ steps.validate.outcome }}
          DIAGNOSTIC_ARCHITECTURE: ${{ steps.architecture.outcome }}
          DIAGNOSTIC_STAGE: ${{ steps.stage.outcome }}
        run: python scripts/native_diagnostics.py bundle
      - name: Upload diagnostics (never a release)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: UNQUALIFIED-DIAGNOSTIC-macos-pro-${{ github.sha }}
          path: |
            diagnostic-artifacts/
            build-ci/logs/
          if-no-files-found: warn
          retention-days: 7
