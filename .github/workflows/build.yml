# Build, test and validate Luthier on Linux, Windows (MSVC) and macOS (universal).
#
# Called per push and pull request by ci-cadence.yml (Linux, Windows and macOS
# in parallel on every push: plugin targets + LuthierTests +
# LuthierRender, unit tests, pluginval at strictness 5, clap-validator). On
# manual dispatch: any platforms, LTO on and pluginval at strictness 10.
# release.yml calls this workflow with package=true to build the installers
# from the same jobs.
#
# The heavy lifting is in scripts/ci_build.sh and scripts/ci_build.ps1 so that
# every step can be reproduced locally with the same command.
name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated: linux, windows, macos'
        type: string
        default: 'linux,windows,macos'
      editions:
        description: 'Comma-separated: pro, free'
        type: string
        default: 'pro,free'
      strictness:
        description: 'pluginval strictness (1-10)'
        type: number
        default: 10
      lto:
        description: 'Link-time optimisation'
        type: boolean
        default: true
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated: linux, windows, macos (ci-cadence.yml picks per push)'
        type: string
        default: 'linux,windows,macos'
      editions:
        description: 'Comma-separated: pro, free'
        type: string
        default: 'pro,free'
      strictness:
        type: number
        default: 10
      lto:
        type: boolean
        default: true
      package:
        description: 'Also build the platform installers (release.yml)'
        type: boolean
        default: false
      version:
        description: 'Version string for the installers, e.g. 1.2.3'
        type: string
        default: ''
      ref:
        description: 'Git ref to build (release.yml passes the tag)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes a running build; a release
  # (workflow_call) or nightly run is never cancelled.
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.package }}

env:
  # push / pull_request: fast (no LTO, strictness 5). schedule: LTO and
  # strictness 10. workflow_dispatch and workflow_call: the inputs, which
  # default to the same. Under workflow_call github.event_name is the caller's
  # (a tag push for release.yml), so the release run is recognised by its
  # package input instead.
  # SPEC-SWEEP HI-43 (host-integration 10): a push to main or master - a
  # merge - validates at strictness 10; other pushes and pull requests at 5.
  STRICTNESS: ${{ ((github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master')) && !inputs.package && !inputs.lto) && 5 || (inputs.strictness || 10) }}
  LTO: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.package && !inputs.lto) && 'OFF' || ((github.event_name == 'schedule' || inputs.lto) && 'ON' || 'OFF') }}
  BUILD_DIR: build-ci
  DIST_DIR: dist
  CONFIG: Release
  LUTHIER_BUILD_STRING: ${{ inputs.version == '0.1.0-beta' && format('beta.{0}', github.sha) || github.sha }}

jobs:
  plan:
    name: Pick platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}
          EDITIONS: ${{ inputs.editions || 'pro,free' }}
        run: |
          items=()
          add() { # name os platform edition
            case "$4" in PAID) e=pro;; *) e=free;; esac
            case ",$EDITIONS," in *,"$e",*) items+=("{\"name\":\"$1\",\"os\":\"$2\",\"platform\":\"$3\",\"edition\":\"$4\"}");; esac
          }
          case ",$PLATFORMS," in *,linux,*)
            add "Linux x64 / Pro" ubuntu-latest linux PAID
            add "Linux x64 / Free" ubuntu-latest linux FREE;;
          esac
          case ",$PLATFORMS," in *,windows,*)
            add "Windows x64 / Pro" windows-latest windows PAID
            add "Windows x64 / Free" windows-latest windows FREE;;
          esac
          case ",$PLATFORMS," in *,macos,*)
            add "macOS universal / Pro" macos-latest macos PAID
            add "macOS universal / Free" macos-latest macos FREE;;
          esac
          if [ ${#items[@]} -eq 0 ]; then echo "::error::no builds for platforms '$PLATFORMS' editions '$EDITIONS'"; exit 1; fi
          joined=$(IFS=,; echo "${items[*]}")
          echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    env:
      LUTHIER_EDITION: ${{ matrix.edition }}
    runs-on: ${{ matrix.os }}
    # macOS runners are markedly slower than Linux/Windows for this LTO build +
    # the sequential render/preset-heavy LuthierTests suite: run #12 (beta1) was
    # still passing tests (steady progress, no hang) when it hit the 180-min cap.
    # Give macOS more headroom; Linux/Windows keep the tighter 180-min cap.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 300 || 180 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      # ---------------------------------------------------------- toolchains
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libcurl4-openssl-dev \
            libgl1-mesa-dev \
            xvfb clang lld ninja-build dpkg-dev

      - name: Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # ccache cannot wrap MSVC through CMake's launcher reliably; sccache can.
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ matrix.platform }}-${{ matrix.edition }}-lto${{ env.LTO }}
          max-size: 2G

      # ---------------------------------------------------------- sources
      - name: Cache JUCE and clap-juce-extensions
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/JUCE
            ThirdParty/clap-juce-extensions
          # The pinned versions live in the CI scripts; changing them busts this.
          key: thirdparty-${{ runner.os }}-${{ hashFiles('scripts/ci_build.sh', 'scripts/ci_build.ps1') }}

      - name: Fetch dependencies (Unix)
        if: runner.os != 'Windows'
        run: scripts/ci_build.sh deps
      - name: Fetch dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci_build.ps1 -Step deps

      # riff-library RL-01: the committed factory riffs are exactly the
      # generator's output (it validates the content as it goes).
      - name: Factory riffs are up to date
        if: runner.os == 'Linux'
        run: |
          python3 Tools/generate_factory_riffs.py
          git diff --exit-code Resources/Riffs

      - name: Factory calibration publication tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_regen_normalization_factory.py' -v

      # ---------------------------------------------------------- build
      - name: Configure and build (Unix)
        id: build_unix
        if: runner.os != 'Windows'
        env:
          LUTHIER_LTO: ${{ env.LTO }}
        run: scripts/ci_build.sh configure build
      - name: Configure and build (Windows)
        id: build_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci_build.ps1 -Step configure,build -Lto ${{ env.LTO }} -Edition ${{ matrix.edition }} -Jobs 4

      # Run the known macOS release blockers first so their diagnostics are
      # available without waiting for the multi-hour complete suite. The full
      # suite below remains mandatory; this does not change release gates.
      - name: Early release regression tests (Unix Pro)
        if: runner.os != 'Windows' && matrix.edition == 'PAID'
        env:
          LUTHIER_NORMALIZATION_TRACE_KEYS: '1'
        shell: bash
        run: |
          set -o pipefail
          runner="$BUILD_DIR/LuthierTests_artefacts/$CONFIG/LuthierTests"
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a); fi
          "${wrap[@]}" "$runner" FactoryGuitarOverrideUsesSelectedInstrument CalibrationHashIgnoresPresetMetadata ON03_FactoryTableDoesNotDrift CQ23_ PracticeTrack \
            2>&1 | tee "$BUILD_DIR/logs/release-regressions.log"

      - name: Early release regression tests (Windows Pro)
        if: runner.os == 'Windows' && matrix.edition == 'PAID'
        env:
          LUTHIER_NORMALIZATION_TRACE_KEYS: '1'
        shell: pwsh
        run: |
          & "$env:BUILD_DIR/LuthierTests_artefacts/$env:CONFIG/LuthierTests.exe" FactoryGuitarOverrideUsesSelectedInstrument CalibrationHashIgnoresPresetMetadata ON03_FactoryTableDoesNotDrift CQ23_ PracticeTrack 2>&1 | Tee-Object -FilePath "$env:BUILD_DIR/logs/release-regressions.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # When the committed factory cache misses live Pro hashes, regenerate
      # the complete reference table in an isolated artifact for review. Do
      # not replace the checked-in table or silently turn a failure green.
      - name: Diagnose stale normalization factory table (Linux Pro)
        if: ${{ failure() && runner.os == 'Linux' && matrix.edition == 'PAID' && github.head_ref == 'codex/luthier-pro-v01-release' }}
        shell: bash
        run: |
          set -euo pipefail
          renderer="$BUILD_DIR/LuthierRender_artefacts/$CONFIG/LuthierRender"
          test -x "$renderer"
          mkdir -p "$BUILD_DIR/normalization-diagnostics"
          xvfb-run -a "$renderer" --calibrate-factory "$PWD/$BUILD_DIR/normalization-diagnostics/NormalizationFactory.regenerated.json" \
            2>&1 | tee "$BUILD_DIR/normalization-diagnostics/regeneration.log"
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          committed = json.loads(Path('Resources/NormalizationFactory.json').read_text())
          regenerated = json.loads(Path('build-ci/normalization-diagnostics/NormalizationFactory.regenerated.json').read_text())
          old = set(committed['entries'])
          new = set(regenerated['entries'])
          print(f"committed={len(old)} regenerated={len(new)} retained={len(old & new)} added={len(new-old)} removed={len(old-new)}")
          header = Path('Source/Support/NormalizationCalibrator.h').read_text()
          expected_revision = int(re.search(r'kCalibrationRevision\s*=\s*(\d+)', header).group(1))
          assert regenerated['revision'] == expected_revision, 'Unexpected calibration revision'
          print(f"revision committed={committed['revision']} regenerated={regenerated['revision']} expected={expected_revision}")
          assert regenerated['entries'], 'Regenerated factory table is empty'
          PY

      - name: Upload normalization factory diagnostics
        if: ${{ always() && runner.os == 'Linux' && matrix.edition == 'PAID' && github.head_ref == 'codex/luthier-pro-v01-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: normalization-factory-diagnostics-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/normalization-diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------- test
      - name: Unit tests (Unix)
        if: runner.os != 'Windows' && steps.build_unix.outcome == 'success'
        run: scripts/ci_build.sh test
      - name: Unit tests (Windows)
        if: runner.os == 'Windows' && steps.build_windows.outcome == 'success'
        shell: pwsh
        run: scripts/ci_build.ps1 -Step test -Edition ${{ matrix.edition }}

      # Validators run even when a unit test failed: they answer a different
      # question (does the plugin load and behave in a host) and the log is
      # worth having either way.
      - name: pluginval + clap-validator (Unix)
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build_unix.outcome == 'success' }}
        env:
          PLUGINVAL_STRICTNESS: ${{ env.STRICTNESS }}
        run: scripts/ci_build.sh validate
      - name: pluginval + clap-validator (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_windows.outcome == 'success' }}
        shell: pwsh
        run: scripts/ci_build.ps1 -Step validate -Edition ${{ matrix.edition }} -Strictness ${{ env.STRICTNESS }}

      # ---------------------------------------------------------- stage
      - name: Stage products (Unix)
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build_unix.outcome == 'success' }}
        run: scripts/ci_build.sh stage
      - name: Stage products (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_windows.outcome == 'success' }}
        shell: pwsh
        run: scripts/ci_build.ps1 -Step stage -Edition ${{ matrix.edition }}

      - name: Upload plugins
        if: ${{ !cancelled() && (steps.build_unix.outcome == 'success' || steps.build_windows.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: Luthier-${{ matrix.edition }}-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ env.DIST_DIR }}/${{ matrix.platform }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.edition }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/logs
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------- installers
      # Only when release.yml calls this workflow. Signing secrets are optional:
      # each script signs when its secrets are present and says so when not.
      - name: Package (Linux)
        if: inputs.package && runner.os == 'Linux'
        env:
          VERSION: ${{ inputs.version }}
          BETA_README: ${{ inputs.version == '0.1.0-beta' && 'docs/beta/PRO-V01-RELEASE-NOTES.md' || '' }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/package_linux.sh

      - name: Package (macOS)
        if: inputs.package && runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.version }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_DEV_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/package_macos.sh

      - name: Package (Windows)
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:VERSION -eq '0.1.0-beta') {
            scripts/package_windows.ps1 -BetaReadme docs/beta/PRO-V01-RELEASE-NOTES.md
          } else {
            scripts/package_windows.ps1
          }

      - name: Verify and archive universal Pro beta bundles
        if: inputs.package && runner.os == 'macOS' && matrix.edition == 'PAID' && inputs.version == '0.1.0-beta'
        shell: bash
        run: |
          set -euo pipefail
          for kind in app vst3 component clap; do
            bundle="$DIST_DIR/macos/Luthier Pro.$kind"
            lipo -verify_arch arm64 x86_64 "$bundle/Contents/MacOS/Luthier Pro"
            codesign --verify --deep --strict "$bundle"
          done
          cp docs/beta/PRO-V01-RELEASE-NOTES.md "$DIST_DIR/macos/README-BETA.md"
          ditto -c -k --sequesterRsrc --keepParent "$DIST_DIR/macos" \
            "$DIST_DIR/installers/Luthier-Pro-0.1.0-beta-macOS-universal.zip"

      - name: Upload installers
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.edition }}-${{ matrix.platform }}
          path: ${{ env.DIST_DIR }}/installers
          if-no-files-found: error
