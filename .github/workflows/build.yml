# Build, test and validate Luthier on Linux, Windows (MSVC) and macOS (universal).
#
# Called by pr-verification.yml (the per-push Linux gate), ci-cadence.yml
# (pushes to the default and integration branches) and the release workflows.
# Each job compiles once and runs every test, validator and packaging step on
# that one build tree. On manual dispatch: any platforms, LTO on and pluginval
# at strictness 10 by default. release.yml calls this workflow with
# package=true to build the installers from the same jobs.
# See docs/infra/CI.md for what runs when.
#
# The heavy lifting is in scripts/ci_build.sh and scripts/ci_build.ps1 so that
# every step can be reproduced locally with the same command.
name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated: linux, windows, macos'
        type: string
        default: 'linux,windows,macos'
      editions:
        description: 'Comma-separated: pro, free'
        type: string
        default: 'pro,free'
      strictness:
        description: 'pluginval strictness (1-10)'
        type: number
        default: 10
      lto:
        description: 'Link-time optimisation'
        type: boolean
        default: true
      targets:
        description: 'Build only these CMake targets (space separated; empty = all, needed for the plugin artifacts)'
        type: string
        default: ''
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated: linux, windows, macos (ci-cadence.yml picks per push)'
        type: string
        default: 'linux,windows,macos'
      editions:
        description: 'Comma-separated: pro, free'
        type: string
        default: 'pro,free'
      strictness:
        type: number
        default: 10
      lto:
        type: boolean
        default: true
      package:
        description: 'Also build the platform installers (release.yml)'
        type: boolean
        default: false
      version:
        description: 'Version string for the installers, e.g. 1.2.3'
        type: string
        default: ''
      ref:
        description: 'Git ref to build (release.yml passes the tag)'
        type: string
        default: ''
      targets:
        description: >-
          Build only these CMake targets (space separated). Empty = every
          target, which staging, the plugin artifacts and packaging need.
          Validators run when Luthier_VST3 is built.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes a running build; a release
  # (workflow_call) or nightly run is never cancelled.
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.package }}

env:
  # push / pull_request: fast (no LTO, strictness 5). schedule: LTO and
  # strictness 10. workflow_dispatch and workflow_call: the inputs, which
  # default to the same. Under workflow_call github.event_name is the caller's
  # (a tag push for release.yml), so the release run is recognised by its
  # package input instead.
  # SPEC-SWEEP HI-43 (host-integration 10): a push to main or master - a
  # merge - validates at strictness 10; other pushes and pull requests at 5.
  STRICTNESS: ${{ ((github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master')) && !inputs.package && !inputs.lto) && 5 || (inputs.strictness || 10) }}
  LTO: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.package && !inputs.lto) && 'OFF' || ((github.event_name == 'schedule' || inputs.lto) && 'ON' || 'OFF') }}
  BUILD_DIR: build-ci
  DIST_DIR: dist
  CONFIG: Release
  LUTHIER_BUILD_STRING: ${{ inputs.version == '0.1.0-beta' && format('beta.{0}', inputs.ref || github.sha) || inputs.ref || github.sha }}

jobs:
  plan:
    name: Pick platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos' }}
          EDITIONS: ${{ inputs.editions || 'pro,free' }}
          TARGETS: ${{ inputs.targets }}
          PACKAGE: ${{ inputs.package }}
        run: |
          # Installers are built from the staged products, which need every target.
          if [ "$PACKAGE" = true ] && [ -n "$TARGETS" ]; then echo "::error::package=true needs every target (targets must be empty)"; exit 1; fi
          items=()
          add() { # name os platform edition
            case "$4" in PAID) e=pro;; *) e=free;; esac
            case ",$EDITIONS," in *,"$e",*) items+=("{\"name\":\"$1\",\"os\":\"$2\",\"platform\":\"$3\",\"edition\":\"$4\"}");; esac
          }
          case ",$PLATFORMS," in *,linux,*)
            add "Linux x64 / Pro" ubuntu-24.04 linux PAID
            add "Linux x64 / Free" ubuntu-24.04 linux FREE;;
          esac
          case ",$PLATFORMS," in *,windows,*)
            add "Windows x64 / Pro" windows-2025 windows PAID
            add "Windows x64 / Free" windows-2025 windows FREE;;
          esac
          case ",$PLATFORMS," in *,macos,*)
            add "macOS universal / Pro" macos-26 macos PAID
            add "macOS universal / Free" macos-26 macos FREE;;
          esac
          if [ ${#items[@]} -eq 0 ]; then echo "::error::no builds for platforms '$PLATFORMS' editions '$EDITIONS'"; exit 1; fi
          joined=$(IFS=,; echo "${items[*]}")
          echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    env:
      LUTHIER_EDITION: ${{ matrix.edition }}
      # Empty = every target (ci_build.sh build_targets).
      BUILD_TARGETS: ${{ inputs.targets }}
      # Parallel compile jobs per runner, about one per 2 GB for this heavy
      # C++ (runner sizes for public repositories): Linux and Windows 4 vCPU
      # / 16 GB, macOS arm64 3 vCPU / 7 GB (a universal build compiles every
      # source twice). Exit 143 / "Killed signal terminated program cc1plus"
      # mid-compile means out of memory: lower this, never use a bare --parallel.
      JOBS: ${{ matrix.platform == 'macos' && '3' || '4' }}
    runs-on: ${{ matrix.os }}
    # macOS runners are markedly slower than Linux/Windows for this LTO build +
    # the sequential render/preset-heavy LuthierTests suite: run #12 (beta1) was
    # still passing tests (steady progress, no hang) when it hit the 180-min cap.
    # macOS native Pro verification reached the old 300-minute cap in run
    # 39196004115 after the full unit suite passed, during AU pluginval.
    # GitHub-hosted jobs permit at most 360 minutes. Keep the full test and
    # validator gates and give this platform the available headroom.
    timeout-minutes: ${{ matrix.platform == 'macos' && 360 || 180 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1

      # ---------------------------------------------------------- toolchains
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libcurl4-openssl-dev \
            libgl1-mesa-dev \
            xvfb clang lld ninja-build dpkg-dev

      # Ninja is preinstalled on the pinned ubuntu-24.04, windows-2025 and
      # macos-26 images (actions/runner-images readmes, 2026-11); Linux also
      # gets it from apt above. Fall back to the system package manager.
      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja >/dev/null || brew install ninja
          ninja --version

      # The MSVC developer environment, imported from vcvarsall.bat of the
      # newest Visual Studio with the x64 C++ tools (vswhere ships with the
      # image). Compiler output is not cached (docs/infra/CI.md).
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools on this runner.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $vars = & cmd.exe /d /c "`"$vcvars`" x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat x64 failed ($LASTEXITCODE)." }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          Write-Host "MSVC environment from $vcvars"
      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      # ---------------------------------------------------------- sources
      # The cache key is the pins themselves, read from the CI scripts, so an
      # unrelated script edit does not re-clone JUCE. The two scripts must pin
      # the same clap-juce-extensions commit. Configure patches both trees in
      # place (cmake/JuceMidiCapacity.cmake, cmake/ClapHostIntent.cmake), so
      # the patch scripts are part of the key too.
      - name: Dependency pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          juce=$(sed -n 's/^JUCE_TAG="\(.*\)"$/\1/p' scripts/ci_build.sh)
          clap=$(sed -n 's/^CLAP_JUCE_EXT_COMMIT="\(.*\)"$/\1/p' scripts/ci_build.sh)
          ps_juce=$(sed -n "s/^\$JuceTag = '\(.*\)'.*$/\1/p" scripts/ci_build.ps1)
          ps_clap=$(sed -n "s/^\$ClapJuceExtCommit = '\(.*\)'.*$/\1/p" scripts/ci_build.ps1)
          [ -n "$juce" ] && [ "${#clap}" -eq 40 ] || { echo "::error::cannot read the dependency pins from scripts/ci_build.sh"; exit 1; }
          [ "$juce" = "$ps_juce" ] && [ "$clap" = "$ps_clap" ] || { echo "::error::scripts/ci_build.sh and scripts/ci_build.ps1 pin different dependencies"; exit 1; }
          echo "key=juce-$juce-clap-$clap" >> "$GITHUB_OUTPUT"
      - name: Cache JUCE and clap-juce-extensions
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/JUCE
            ThirdParty/clap-juce-extensions
          key: thirdparty-${{ runner.os }}-${{ steps.pins.outputs.key }}-${{ hashFiles('scripts/patch_juce_midi_capacity.py', 'scripts/patch_clap_host_intent.py') }}

      - name: Fetch dependencies (Unix)
        if: runner.os != 'Windows'
        run: scripts/ci_build.sh deps
      - name: Fetch dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci_build.ps1 -Step deps

      # riff-library RL-01: the committed factory riffs are exactly the
      # generator's output (it validates the content as it goes).
      - name: Factory riffs are up to date
        if: runner.os == 'Linux'
        run: |
          python3 Tools/generate_factory_riffs.py
          git diff --exit-code Resources/Riffs

      - name: Factory calibration publication tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_regen_normalization_factory.py' -v

      # Formerly quick-check.yml: script syntax and the beta-asset helper tests.
      - name: Shell and Python syntax, release-asset helper tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci_build.sh scripts/package_macos.sh
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_prepare_pro_beta_assets.py' -v

      # ---------------------------------------------------------- build
      - name: Configure and build (Unix)
        id: build_unix
        if: runner.os != 'Windows'
        env:
          LUTHIER_LTO: ${{ env.LTO }}
        run: scripts/ci_build.sh configure build
      - name: Configure and build (Windows)
        id: build_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci_build.ps1 -Step configure,build -Lto ${{ env.LTO }} -Edition ${{ matrix.edition }} -Jobs ${{ env.JOBS }}

      # Run the known macOS release blockers first so their diagnostics are
      # available without waiting for the multi-hour complete suite. The full
      # suite below remains mandatory; this does not change release gates.
      - name: Early release regression tests (Unix Pro)
        if: runner.os != 'Windows' && matrix.edition == 'PAID'
        env:
          LUTHIER_NORMALIZATION_TRACE_KEYS: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/logs"
          runner="$BUILD_DIR/LuthierTests_artefacts/$CONFIG/LuthierTests"
          if [ ! -x "$runner" ]; then
            echo "::error::Early regression test runner missing or not executable: $runner" >&2
            exit 1
          fi
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a); fi
          ${wrap[@]+"${wrap[@]}"} "$runner" FactoryGuitarOverrideUsesSelectedInstrument CalibrationHashIgnoresPresetMetadata ON03_FactoryTableDoesNotDrift CQ23_ PracticeTrack \
            2>&1 | tee "$BUILD_DIR/logs/release-regressions.log"

      - name: Early release regression tests (Windows Pro)
        if: runner.os == 'Windows' && matrix.edition == 'PAID'
        env:
          LUTHIER_NORMALIZATION_TRACE_KEYS: '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:BUILD_DIR 'logs') | Out-Null
          & "$env:BUILD_DIR/LuthierTests_artefacts/$env:CONFIG/LuthierTests.exe" FactoryGuitarOverrideUsesSelectedInstrument CalibrationHashIgnoresPresetMetadata ON03_FactoryTableDoesNotDrift CQ23_ PracticeTrack 2>&1 | Tee-Object -FilePath "$env:BUILD_DIR/logs/release-regressions.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # When the committed factory cache misses live Pro hashes, regenerate
      # the complete reference table in an isolated artifact for review. Do
      # not replace the checked-in table or silently turn a failure green.
      - name: Diagnose stale normalization factory table (Linux Pro)
        if: ${{ failure() && runner.os == 'Linux' && matrix.edition == 'PAID' && github.head_ref == 'codex/luthier-pro-v01-release' }}
        shell: bash
        run: |
          set -euo pipefail
          renderer="$BUILD_DIR/LuthierRender_artefacts/$CONFIG/LuthierRender"
          test -x "$renderer"
          mkdir -p "$BUILD_DIR/normalization-diagnostics"
          xvfb-run -a "$renderer" --calibrate-factory "$PWD/$BUILD_DIR/normalization-diagnostics/NormalizationFactory.regenerated.json" \
            2>&1 | tee "$BUILD_DIR/normalization-diagnostics/regeneration.log"
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          committed = json.loads(Path('Resources/NormalizationFactory.json').read_text())
          regenerated = json.loads(Path('build-ci/normalization-diagnostics/NormalizationFactory.regenerated.json').read_text())
          old = set(committed['entries'])
          new = set(regenerated['entries'])
          print(f"committed={len(old)} regenerated={len(new)} retained={len(old & new)} added={len(new-old)} removed={len(old-new)}")
          header = Path('Source/Support/NormalizationCalibrator.h').read_text()
          expected_revision = int(re.search(r'kCalibrationRevision\s*=\s*(\d+)', header).group(1))
          assert regenerated['revision'] == expected_revision, 'Unexpected calibration revision'
          print(f"revision committed={committed['revision']} regenerated={regenerated['revision']} expected={expected_revision}")
          assert regenerated['entries'], 'Regenerated factory table is empty'
          PY

      - name: Upload normalization factory diagnostics
        if: ${{ always() && runner.os == 'Linux' && matrix.edition == 'PAID' && github.head_ref == 'codex/luthier-pro-v01-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: normalization-factory-diagnostics-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/normalization-diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------- test
      # Linux: the whole suite as one process per vCPU (TestSelection
      # --shard=i/N, own HOME and TMPDIR each). The step fails unless every
      # listed test ran in exactly one shard and every shard printed its
      # summary. macOS and Windows still run one process.
      - name: Unit tests (Unix)
        if: runner.os != 'Windows' && steps.build_unix.outcome == 'success'
        env:
          TEST_SHARDS: ${{ runner.os == 'Linux' && '4' || '1' }}
        run: scripts/ci_build.sh test
      - name: Unit tests (Windows)
        if: runner.os == 'Windows' && steps.build_windows.outcome == 'success'
        shell: pwsh
        run: scripts/ci_build.ps1 -Step test -Edition ${{ matrix.edition }}

      - name: Collect macOS native failure evidence
        if: ${{ failure() && runner.os == 'macOS' }}
        run: scripts/ci_build.sh collect-failure-evidence

      # Validators run even when a unit test failed: they answer a different
      # question (does the plugin load and behave in a host) and the log is
      # worth having either way.
      - name: pluginval + clap-validator (Unix)
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build_unix.outcome == 'success' && (inputs.targets == '' || contains(format(' {0} ', inputs.targets), ' Luthier_VST3 ')) }}
        env:
          PLUGINVAL_STRICTNESS: ${{ env.STRICTNESS }}
        run: scripts/ci_build.sh validate
      - name: pluginval + clap-validator (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_windows.outcome == 'success' && (inputs.targets == '' || contains(format(' {0} ', inputs.targets), ' Luthier_VST3 ')) }}
        shell: pwsh
        run: scripts/ci_build.ps1 -Step validate -Edition ${{ matrix.edition }} -Strictness ${{ env.STRICTNESS }}

      # ---------------------------------------------------------- stage
      # Only a full build stages and uploads the plugins: a narrowed gate
      # build (inputs.targets) ships nothing.
      - name: Stage products (Unix)
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build_unix.outcome == 'success' && inputs.targets == '' }}
        run: scripts/ci_build.sh stage
      - name: Stage products (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_windows.outcome == 'success' && inputs.targets == '' }}
        shell: pwsh
        run: scripts/ci_build.ps1 -Step stage -Edition ${{ matrix.edition }}

      - name: Upload plugins
        if: ${{ !cancelled() && (steps.build_unix.outcome == 'success' || steps.build_windows.outcome == 'success') && inputs.targets == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Luthier-${{ matrix.edition }}-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ env.DIST_DIR }}/${{ matrix.platform }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.edition }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/logs
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------- installers
      # Only when release.yml calls this workflow. Signing secrets are optional:
      # each script signs when its secrets are present and says so when not.
      - name: Package (Linux)
        if: inputs.package && runner.os == 'Linux'
        env:
          VERSION: ${{ inputs.version }}
          BETA_README: ${{ inputs.version == '0.1.0-beta2' && 'docs/beta/PRO-V01-BETA2-RELEASE-NOTES.md' || (inputs.version == '0.1.0-beta' && 'docs/beta/PRO-V01-RELEASE-NOTES.md' || '') }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/package_linux.sh

      - name: Package (macOS)
        if: inputs.package && runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.version }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_DEV_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/package_macos.sh

      - name: Package (Windows)
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:VERSION -eq '0.1.0-beta2') {
            scripts/package_windows.ps1 -BetaReadme docs/beta/PRO-V01-BETA2-RELEASE-NOTES.md
          } elseif ($env:VERSION -eq '0.1.0-beta') {
            scripts/package_windows.ps1 -BetaReadme docs/beta/PRO-V01-RELEASE-NOTES.md
          } else {
            scripts/package_windows.ps1
          }

      - name: Verify and archive universal Pro beta bundles
        if: inputs.package && runner.os == 'macOS' && matrix.edition == 'PAID' && (inputs.version == '0.1.0-beta' || inputs.version == '0.1.0-beta2')
        shell: bash
        run: |
          set -euo pipefail
          for kind in app vst3 component clap; do
            bundle="$DIST_DIR/macos/Luthier Pro.$kind"
            lipo "$bundle/Contents/MacOS/Luthier Pro" -verify_arch arm64 x86_64
            codesign --verify --deep --strict "$bundle"
          done
          if [ "${{ inputs.version }}" = "0.1.0-beta2" ]; then
            beta_readme=docs/beta/PRO-V01-BETA2-RELEASE-NOTES.md
          else
            beta_readme=docs/beta/PRO-V01-RELEASE-NOTES.md
          fi
          cp "$beta_readme" "$DIST_DIR/macos/README-BETA.md"
          ditto -c -k --sequesterRsrc --keepParent "$DIST_DIR/macos" \
            "$DIST_DIR/installers/Luthier-Pro-${{ inputs.version }}-macOS-universal.zip"

      - name: Upload installers
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.edition }}-${{ matrix.platform }}
          path: ${{ env.DIST_DIR }}/installers
          if-no-files-found: error
