name: PR verification

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
    with:
      platforms: linux,windows,macos
      editions: ${{ github.head_ref == 'codex/luthier-pro-v01-release' && 'pro' || 'pro,free' }}
      strictness: ${{ github.head_ref == 'codex/luthier-pro-v01-release' && 10 || 5 }}
      lto: ${{ github.head_ref == 'codex/luthier-pro-v01-release' }}
    secrets: inherit
