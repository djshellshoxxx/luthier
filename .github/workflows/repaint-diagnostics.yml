# Temporary native-peer diagnosis for the release continuation branch only.
# This is not release qualification; the complete native release gates remain unchanged.
name: repaint-diagnostics

on:
  push:
    branches: ['codex/luthier-native-repaint-release-20261124']

permissions:
  contents: read

concurrency:
  # Keep the original failure and corrected-source verification inspectable.
  group: repaint-diagnostics-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  focused-linux:
    name: Native guitar repaint diagnosis (Linux Free)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_DIR: build-quick-FREE
      CONFIG: Release
      LUTHIER_EDITION: FREE
      LUTHIER_LTO: OFF
      JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libcurl4-openssl-dev \
            libgl1-mesa-dev xvfb clang lld ninja-build dpkg-dev
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: quick-linux-FREE
          max-size: 2G
      - name: Cache pinned third-party source
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/JUCE
            ThirdParty/clap-juce-extensions
          key: thirdparty-Linux-${{ hashFiles('scripts/ci_build.sh', 'scripts/ci_build.ps1') }}
      - name: Fetch pinned dependencies
        run: scripts/ci_build.sh deps
      - name: Configure the diagnostic test selection
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci_build.sh configure
          # Keep every production and JUCE source and the normal test definitions.
          # Only unrelated test translation units are removed from this temporary
          # runner. CircuitTests supplies the shared allocation-counter definitions.
          cat > "$RUNNER_TEMP/luthier-repaint-filter.cmake" <<'CMAKE'
          function(luthier_focus_repaint_diagnostics)
              if(NOT TARGET LuthierTests)
                  message(FATAL_ERROR "The normal LuthierTests target is required")
              endif()
              get_target_property(repaint_sources LuthierTests SOURCES)
              set(repaint_kept_sources)
              set(repaint_kept_tests)
              foreach(repaint_source IN LISTS repaint_sources)
                  if(repaint_source MATCHES "/Source/Tests/.*\\.cpp$")
                      get_filename_component(repaint_test "${repaint_source}" NAME)
                      if(NOT repaint_test MATCHES "^(TestMain|TestFramework|CircuitTests|QualityModeUiTests)\\.cpp$")
                          continue()
                      endif()
                      list(APPEND repaint_kept_tests "${repaint_test}")
                  endif()
                  list(APPEND repaint_kept_sources "${repaint_source}")
              endforeach()
              list(SORT repaint_kept_tests)
              if(NOT repaint_kept_tests STREQUAL "CircuitTests.cpp;QualityModeUiTests.cpp;TestFramework.cpp;TestMain.cpp")
                  message(FATAL_ERROR "Unexpected diagnostic test sources: ${repaint_kept_tests}")
              endif()
              set_property(TARGET LuthierTests PROPERTY SOURCES "${repaint_kept_sources}")
              message(STATUS "Diagnostic test translation units: ${repaint_kept_tests}")
          endfunction()
          cmake_language(DEFER DIRECTORY "${CMAKE_SOURCE_DIR}" CALL luthier_focus_repaint_diagnostics)
          CMAKE
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_PROJECT_Luthier_INCLUDE="$RUNNER_TEMP/luthier-repaint-filter.cmake" \
            2>&1 | tee "$BUILD_DIR/logs/repaint-configure.log"
      - name: Compile the native diagnostic runner
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --config "$CONFIG" --parallel "$JOBS" --target LuthierTests -- -k 0 \
            2>&1 | tee "$BUILD_DIR/logs/repaint-build.log"
      - name: Verify repaint requests and native delivery
        shell: bash
        run: |
          set -euo pipefail
          runner="$BUILD_DIR/LuthierTests_artefacts/$CONFIG/LuthierTests"
          test -x "$runner"
          xvfb-run -a "$runner" --list CQ23_policyTransition \
            2>&1 | tee "$BUILD_DIR/logs/repaint-selection.log"
          grep -Fxq 'CpuQualityUi :: CQ23_policyTransitionRepaintsGuitarOnce' "$BUILD_DIR/logs/repaint-selection.log"
          grep -Fxq 'CpuQualityUi :: CQ23_policyTransitionReachesNativeGuitar' "$BUILD_DIR/logs/repaint-selection.log"
          grep -Fxq '2 tests' "$BUILD_DIR/logs/repaint-selection.log"
          xvfb-run -a "$runner" CQ23_policyTransition CQ23_lowMeansNoAnimationRepaints CQ23_staticOverlayCountsStateChangesOnly \
            2>&1 | tee "$BUILD_DIR/logs/repaint-regression.log"
      - name: Preserve native diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaint-diagnostics-linux-FREE-${{ github.sha }}
          path: |
            build-quick-FREE/logs/
            build-quick-FREE/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
