# Fast, non-release verification. Full build.yml remains the release gate.
name: quick-check

on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-library-portability:
    name: Native library portability (libc++ and FMA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and libc++
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang libc++-dev libc++abi-dev
      - name: Fetch pinned JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git ThirdParty/JUCE
      - name: Build ownership and exact-gain checks
        shell: bash
        run: |
          set -euo pipefail
          fma=OFF
          if grep -qw fma /proc/cpuinfo; then fma=ON; fi
          cmake -S scripts/portability_checks -B build-portability \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_LIBCXX=ON -DEXERCISE_FMA="$fma" -DSANITIZE=address,undefined
          cmake --build build-portability --parallel 2
      - name: Exercise queued destruction and host parameter capture
        run: build-portability/portability_checks

  recorder-thread-safety:
    name: Recorder thread safety (real JUCE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git ThirdParty/JUCE
      - name: Build recorder checks with ThreadSanitizer
        run: |
          cmake -S scripts/recorder_checks -B build-recorder -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=thread
          cmake --build build-recorder --parallel 2
      - name: Exercise reset, resize, capture, and snapshot export
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: build-recorder/recorder_checks

  focused-linux:
    name: Focused Linux preflight (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [PAID, FREE]
    env:
      BUILD_DIR: build-quick-${{ matrix.edition }}
      CONFIG: Release
      LUTHIER_EDITION: ${{ matrix.edition }}
      LUTHIER_LTO: OFF
      JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci_build.sh scripts/package_macos.sh
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_prepare_pro_beta_assets.py' -v
      - name: Rack lifetime ASan and UBSan isolation checks
        run: python3 scripts/check_effects_chain_lifetime.py
      - name: Linux build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libcurl4-openssl-dev \
            libgl1-mesa-dev xvfb clang lld ninja-build dpkg-dev
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: quick-linux-${{ matrix.edition }}
          max-size: 2G
      - name: Cache pinned third-party source
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/JUCE
            ThirdParty/clap-juce-extensions
          key: thirdparty-Linux-${{ hashFiles('scripts/ci_build.sh', 'scripts/ci_build.ps1') }}
      - name: Fetch pinned dependencies
        run: scripts/ci_build.sh deps
      - name: Configure without LTO
        run: scripts/ci_build.sh configure
      - name: Compile focused test runner
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --config "$CONFIG" --parallel "$JOBS" --target LuthierTests -- -k 0
      - name: Run release blocker smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/logs"
          runner="$BUILD_DIR/LuthierTests_artefacts/$CONFIG/LuthierTests"
          test -x "$runner"
          xvfb-run -a "$runner" FactoryGuitarOverrideUsesSelectedInstrument CalibrationHashIgnoresPresetMetadata ON03_FactoryTableDoesNotDrift ON03_ExplicitCalibrationTransactionIgnoresLoadDelay ON32_EditionIsPartOfTheHash CQ23_ PracticeTrack SessionRecorderRate SessionRecorderConcurrency BackendRelease RefPedalUiLifecycle EffectsChainLifetime \
            RefPedalCe2 RefPedalBbdCore RefPedalChorusMemory RefPedalCe2w RefPedalCe2NodeBypass RefPedalRouting RefPedalBufferedTimeFx RefPedalBbdCurvature \
            HostLatencyThread RefPedalBypassLatency RefPedalBlockPlan RhythmMidiWriter RhythmMidiRouter RhythmMidiOut DeferredEngineMidi \
            RefPedalAssetLifetime RefPedalHostCapture RefPedalControlRace RefPedalState HostState convolutionPreparesSafelyForTinyHostBlocks convolutionTinyHostRateAndCapacityBoundaries \
            2>&1 | tee "$BUILD_DIR/logs/focused-regressions.log"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-check-linux-${{ matrix.edition }}-diagnostics
          path: |
            build-quick-${{ matrix.edition }}/logs/
            build-quick-${{ matrix.edition }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
