name: apply-practice-tab-importer

on:
  push:
    branches:
      - codex/deep-audit-fixes-final2
    paths:
      - '.github/workflows/apply-practice-tab-importer.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deep-audit-fixes-final2
          fetch-depth: 0
      - name: Apply exact wiring edit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/UI/PracticePanel.h')
          s = p.read_text()
          include_old = '#include "../Notation/NotationExport.h"\n'
          include_new = include_old + '#include "PracticeTabImporter.h"\n'
          member_old = '    NotationImporter importer;\n'
          member_new = '    PracticeTabImporter importer;\n'
          if include_new not in s:
              assert s.count(include_old) == 1, s.count(include_old)
              s = s.replace(include_old, include_new, 1)
          if member_new not in s:
              assert s.count(member_old) == 1, s.count(member_old)
              s = s.replace(member_old, member_new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- Source/UI/PracticePanel.h
      - name: Commit wiring
        run: |
          if git diff --quiet -- Source/UI/PracticePanel.h; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/UI/PracticePanel.h
          git commit -m "feat: enable resilient ASCII import in Practice tab"
          git push origin HEAD:codex/deep-audit-fixes-final2
